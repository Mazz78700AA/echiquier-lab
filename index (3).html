<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Échiquier Lab : analyse de parties Stockfish, échiquier libre, tournoi, pendule</title>
<meta name="description" content="Outils d'échecs gratuits : analyse de partie PGN avec Stockfish 18, échiquier libre avec meilleur coup, gestion de tournoi de club, pendule d'échecs et entraînement aux ouvertures. Sans inscription.">
<meta name="theme-color" content="#14171c">
<meta property="og:title" content="Échiquier Lab : outils d'échecs gratuits">
<meta property="og:description" content="Analyse PGN avec Stockfish, calculateur Elo, tournoi de club, pendule et ouvertures.">

<!--GSC-->
<style>:root{--bg:#0e1522;--bg2:#131c2c;--panel:rgba(22,32,50,.84);--panel2:rgba(30,43,66,.9);--line:rgba(130,170,225,.2);--line2:rgba(130,170,225,.38);--g:#e2b866;--g2:#c99a45;--gold:#f0cf8a;--tx:#f1f4f8;--mut:#aebbd0;--red:#ef8a8a;--org:#f0a766;--yel:#eed56f;--lt:#ebe6d6;--dk:#7a97b4;--ok:#7fd0a2;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1100px 700px at 15% -10%,#1d3050 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#1a2a44 0,transparent 55%),var(--bg);color:var(--tx);line-height:1.55;min-height:100vh;-webkit-text-size-adjust:100%}
#nano{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 60px}
a{color:var(--g)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:.2px;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(28px,5vw,46px)}h2{font-size:clamp(21px,3vw,28px)}h3{font-size:18px}
p{margin:.5em 0}
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:linear-gradient(#0e1522f2,#0e1522cc);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-weight:700;font-size:20px;color:var(--tx);text-decoration:none;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;color:#1a1305;font-style:normal;font-size:19px;box-shadow:0 0 18px rgba(226,184,102,.45)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:7px 12px;border-radius:9px;font-size:14.5px;border:1px solid transparent}
nav a:hover{color:var(--tx);border-color:var(--line)}
nav a.on{color:#1a1305;background:var(--g);font-weight:600}
main{padding-top:26px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{display:block;text-decoration:none;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--g);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 24px rgba(226,184,102,.12)}
.card b{display:block;font-family:Georgia,serif;font-size:19px;margin:6px 0 4px}
.card span{color:var(--mut);font-size:14.5px}
.card .ic{font-size:30px;line-height:1;color:var(--g)}
.hero{padding:34px 0 22px;max-width:780px}
.hero p{color:var(--mut);font-size:18px}.hero p:last-child{margin-top:18px}
.badge{display:inline-block;border:1px solid var(--line2);color:var(--g);border-radius:999px;padding:3px 12px;font-size:13px;margin-bottom:12px;background:rgba(226,184,102,.07)}
.btn{appearance:none;border:1px solid var(--line2);background:rgba(226,184,102,.08);color:var(--tx);border-radius:10px;padding:9px 15px;font:inherit;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--g);background:rgba(226,184,102,.18)}
.a.btn,a.btn{text-decoration:none;display:inline-block}
.btn.pri{background:linear-gradient(135deg,#ecc374,#d1a24d);color:#1d1912;border-color:transparent;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dng{border-color:rgba(255,107,107,.5);color:#ffb0b0}
input,select,textarea{font:inherit;color:var(--tx);background:rgba(0,0,0,.45);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:1px}
textarea{width:100%;min-height:150px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
select option{background:#1b1f26}
label{font-size:13.5px;color:var(--mut);display:block;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{min-width:0}
.mut{color:var(--mut)}
.small{font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-size:14.5px}
.tab.on{background:var(--g);color:#1a1305;font-weight:700;border-color:transparent}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.res div{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res small{display:block;color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
.res b{font-family:ui-monospace,Consolas,monospace;font-size:24px;color:var(--gold);font-weight:600}
.res b.pos{color:var(--ok)}.res b.neg{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.msg{padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(226,184,102,.07);margin:10px 0;font-size:14.5px}
.msg.err{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08);color:#ffc4c4}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:rgba(0,0,0,.25)}
summary{cursor:pointer;font-weight:600}
.about{margin-top:26px}
.about h2{margin-top:24px}
.about p,.about li{color:#d3dcea}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px}
footer a{color:var(--mut)}
/* échiquier */
.bwrap{display:flex;gap:8px;align-items:stretch;width:100%;max-width:640px;margin:0 auto}
.ebar{width:16px;border-radius:6px;overflow:hidden;background:#111;border:1px solid var(--line2);position:relative;flex:none}
.ebar i{position:absolute;left:0;right:0;bottom:0;background:#e6e8ec;transition:height .35s}
.ebar.fl i{bottom:auto;top:0}
.ebar span{position:absolute;left:0;right:0;font-size:10px;text-align:center;font-weight:700;font-family:ui-monospace,monospace}
.ebar span.t{top:2px;color:#cfd}.ebar span.b{bottom:2px;color:#223}
.bd{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.07);user-select:none;-webkit-user-select:none;touch-action:manipulation;flex:1}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(236,214,150,.45)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3)}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(236,206,130,.65)}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(25,35,55,.26)}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(25,35,55,.26)}
.sq .pc{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
.sq i{position:absolute;font-style:normal;font-size:clamp(8px,1.7vw,12px);font-weight:600;opacity:.6;pointer-events:none}
.sq.l i{color:var(--dk)}.sq.d i{color:var(--lt)}
.sq i.f{right:3px;bottom:1px}.sq i.r{left:3px;top:1px}
.bd svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bd.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ctl{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.ctl .btn{min-width:46px}
.split{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.moves{max-height:300px;overflow:auto;display:grid;grid-template-columns:38px 1fr 1fr;gap:2px 6px;font-size:14.5px;padding-right:4px}
.moves .no{color:var(--mut);text-align:right}
.mv{padding:2px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;display:flex;gap:6px;align-items:center;min-height:26px}
.mv:hover{border-color:var(--line2)}.mv.on{background:rgba(226,184,102,.22);border-color:var(--g)}
.tag{display:inline-block;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;font-weight:800;line-height:18px;text-align:center;color:#10130f;padding:0 4px}
.c-best{background:#86bf9f}.c-exc{background:#a6c795}.c-good{background:#9fb0c2}.c-book{background:#bba784}.c-inac{background:#d9c677}.c-err{background:#d9996a}.c-blu{background:#d98080}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.graph{width:100%;height:110px;display:block;cursor:pointer;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.prog{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .2s}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat2>div{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat2 h4{margin:0 0 4px;font-size:14px;color:var(--mut)}
.stat2 .big{font-family:ui-monospace,Consolas,monospace;font-size:26px;color:var(--gold)}
.stat2 ul{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:#d3dcea}
.stat2 li{display:flex;justify-content:space-between;gap:8px}
.info{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;min-height:64px;font-size:14.5px}
/* pendule */
.clock{display:grid;gap:12px;max-width:640px;margin:0 auto}
.side{border-radius:20px;border:2px solid var(--line2);background:var(--panel2);padding:20px 10px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.15s;touch-action:manipulation}
.side.act{background:linear-gradient(135deg,rgba(226,184,102,.26),rgba(110,150,210,.2));border-color:var(--g);box-shadow:0 0 30px rgba(226,184,102,.25)}
.side.low{border-color:var(--red);background:rgba(255,107,107,.14)}
.side.flag{background:rgba(255,107,107,.3)}
.side.rot{transform:rotate(180deg)}
.side .tm{font-family:ui-monospace,Consolas,monospace;font-size:clamp(54px,15vw,96px);font-weight:600;letter-spacing:2px;line-height:1}
.side .nm{color:var(--mut);font-size:14px;margin-bottom:6px}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.pre .btn.on{background:var(--g);color:#1a1305;font-weight:700}
/* ouvertures */
.ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.ob{text-align:left;border:1px solid var(--line);background:rgba(0,0,0,.3);border-radius:11px;padding:8px 11px;color:var(--tx);cursor:pointer;font:inherit}
.ob:hover{border-color:var(--g)}.ob.on{border-color:var(--g);background:rgba(226,184,102,.16)}
.ob small{display:block;color:var(--mut)}
.pgnbox{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;color:#d3dcea;word-break:break-word}
@media print{#nano,.top,footer,.noprint{display:none!important}body{background:#fff;color:#000}.glass{background:#fff;border-color:#999}th,td{border-color:#999;color:#000}}
@media(max-width:560px){.top{gap:8px}.logo{font-size:18px}nav a{padding:6px 9px;font-size:13.5px}.stat2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.bd.drag{touch-action:none}
.top .snd{margin-left:auto}
#promo{display:none;gap:8px;justify-content:center;margin:10px 0}
#promo.on{display:flex}
#promo button{width:56px;height:56px;padding:2px;background:var(--lt);border-color:var(--dk)}
#promo .pp{display:block;width:100%;height:100%;background-size:100% 100%}
.bigbtn{padding:12px 20px;font-size:16px}
.stat{font-size:17px;font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
.opt label{display:flex;gap:7px;align-items:center;margin:0;color:var(--tx);font-size:14.5px;cursor:pointer}
.opt input[type=checkbox]{width:18px;height:18px;accent-color:#e2b866}
.evb{font-family:ui-monospace,Consolas,monospace;font-size:22px;color:var(--gold)}

.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transform:translate(-50%,-50%) scale(1.12)}
.bd.drag .sq{cursor:grab}
.nano-soft{opacity:.9}
</style>
</head>

<script>/* Échiquier Lab — outils d'échecs gratuits. Tout tourne dans le navigateur. */
(function () {
"use strict";

var main = $("main");
var FILES = "abcdefgh";
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function sget(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function sset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

var cleanups = [];

/* ---------- sons légers ---------- */
var SND = { on: sget("ecl_snd", true), ac: null };
function sndCtx() { try { SND.ac = SND.ac || new (window.AudioContext || window.webkitAudioContext)(); if (SND.ac.state === "suspended") SND.ac.resume(); return SND.ac; } catch (e) { return null; } }
function tap(delay, lp, vol, f0) {
  var ac = sndCtx(); if (!ac) return; var t = ac.currentTime + delay, sr = ac.sampleRate, len = Math.floor(sr * .07);
  var buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  var src = ac.createBufferSource(); src.buffer = buf;
  var fl = ac.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp;
  var g = ac.createGain(); g.gain.value = vol; src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(t);
  var o = ac.createOscillator(), og = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .08);
  og.gain.setValueAtTime(vol * .55, t); og.gain.exponentialRampToValueAtTime(.0001, t + .1); o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + .12);
}
function ding(freq, delay, vol) {
  var ac = sndCtx(); if (!ac) return; var t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .4);
}
function playMove(m) {
  if (!SND.on || !m) return;
  var san = m.san || "";
  if (/#/.test(san)) { tap(0, 1500, .2, 190); ding(523, .05, .07); ding(392, .2, .07); ding(262, .35, .07); return; }
  if (m.flags && /[kq]/.test(m.flags)) { tap(0, 1700, .2, 200); tap(.11, 1700, .2, 220); }
  else if (m.captured) { tap(0, 1100, .34, 150); tap(.035, 1400, .14, 190); }
  else tap(0, 1900, .22, 210);
  if (/\+/.test(san)) ding(740, .08, .05);
}
function playUi() { if (SND.on) tap(0, 2500, .12, 260); }

/* ---------- pièces ---------- */
var PIECES = window.__PIECES__;
(function () {

/* ---------- échiquier ---------- */
function Board(host, onSquare) {
  this.host = host; this.flip = false; this.onSquare = onSquare;
  host.classList.add("bd");
  var self = this;
  host.addEventListener("click", function (e) {
    var q = e.target.closest && e.target.closest(".sq");
    if (q && self.onSquare) self.onSquare(q.getAttribute("data-sq"));
  });
}
Board.prototype.set = function (fen, o) {
  o = o || {};
  var rows = fen.split(" ")[0].split("/"), map = {}, r, f, i, ch;
  for (r = 0; r < 8; r++) { var file = 0; for (i = 0; i < rows[r].length; i++) { ch = rows[r][i]; if (/\d/.test(ch)) file += +ch; else { map[FILES[file] + (8 - r)] = (ch === ch.toUpperCase() ? "w" : "b") + ch.toUpperCase(); file++; } } }
  var h = "", fl = this.flip;
  for (r = 0; r < 8; r++) for (f = 0; f < 8; f++) {
    var fi = fl ? 7 - f : f, ra = fl ? r + 1 : 8 - r, sq = FILES[fi] + ra;
    var cls = "sq " + ((fi + ra) % 2 === 0 ? "l" : "d");
    if (o.last && (o.last[0] === sq || o.last[1] === sq)) cls += " last";
    if (o.sel === sq) cls += " sel";
    if (o.hint === sq) cls += " hint";
    if (o.dots && o.dots[sq]) cls += o.dots[sq] === 2 ? " cap" : " dot";
    h += '<div class="' + cls + '" data-sq="' + sq + '">';
    if (f === 7 - 0 && false) {}
    if (r === 7) h += '<i class="f">' + FILES[fi] + "</i>";
    if (f === 0) h += '<i class="r">' + ra + "</i>";
    if (map[sq]) h += '<div class="pc p-' + map[sq] + '"></div>';
    h += "</div>";
  }
  var sv = "";
  if (o.arrows && o.arrows.length) {
    sv = '<svg viewBox="0 0 8 8">';
    for (i = 0; i < o.arrows.length; i++) sv += this.arrow(o.arrows[i]);
    sv += "</svg>";
  }
  this.host.innerHTML = h + sv;
};
Board.prototype.xy = function (sq) {
  var f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
  return this.flip ? [7 - f + 0.5, r + 0.5] : [f + 0.5, 7 - r + 0.5];
};
Board.prototype.arrow = function (a) {
  var p = this.xy(a.from), q = this.xy(a.to), dx = q[0] - p[0], dy = q[1] - p[1], L = Math.sqrt(dx * dx + dy * dy) || 1;
  var ux = dx / L, uy = dy / L, hd = 0.34, sx = p[0] + ux * 0.25, sy = p[1] + uy * 0.25, ex = q[0] - ux * hd * 0.9, ey = q[1] - uy * hd * 0.9;
  var col = a.color || "#e2b05a", nx = -uy, ny = ux;
  return '<g opacity="0.72"><line x1="' + sx + '" y1="' + sy + '" x2="' + ex + '" y2="' + ey + '" stroke="' + col + '" stroke-width="0.16" stroke-linecap="round"/><polygon fill="' + col + '" points="' + (q[0] - ux * 0.02) + "," + (q[1] - uy * 0.02) + " " + (q[0] - ux * hd + nx * 0.2) + "," + (q[1] - uy * hd + ny * 0.2) + " " + (q[0] - ux * hd - nx * 0.2) + "," + (q[1] - uy * hd - ny * 0.2) + '"/></g>';
};

}
var ENG_SLOW = "Le moteur ne répond pas. Vérifie que le fichier stockfish.wasm (environ 7 Mo) est bien dans le dépôt GitHub, à côté de index.html, puis recharge la page (Ctrl+F5).";
function engStart() {
  if (ENG.w || ENG.dead) return;
  try {
    ENG.w = new Worker("stockfish.js");
  } catch (e) { ENG.dead = e; return; }
  ENG.w.onmessage = function (e) { engLine(String(e.data)); };
  ENG.w.onerror = function () { ENG.dead = new Error("Stockfish introuvable"); if (ENG.cur) { var c = ENG.cur; ENG.cur = null; c.rej(ENG.dead); } };

  ENG.w.postMessage("setoption name Hash value 32");
  ENG.w.postMessage("isready");
}
function engLine(l) {
  var c = ENG.cur; if (!c) return;
  if (l.indexOf("info") === 0 && l.indexOf(" score ") > 0 && l.indexOf("lowerbound") < 0 && l.indexOf("upperbound") < 0) {
    var m = /score (cp|mate) (-?\d+)/.exec(l); if (m) { c.type = m[1]; c.val = +m[2]; }
    var p = / pv (.+)$/.exec(l); if (p) { c.pvFull = p[1].split(" "); c.pv = c.pvFull[0]; }
    var d = / depth (\d+)/.exec(l); if (d) c.depth = +d[1];
  } else if (l.indexOf("bestmove") === 0) {
    ENG.cur = null;
    var bm = l.split(" ")[1];
    c.res({ type: c.type, val: c.val, best: bm && bm !== "(none)" ? bm : c.pv, depth: c.depth, pv: c.pvFull || [] });
    if (ENG.pending) { var nx = ENG.pending; ENG.pending = null; engRun(nx); }
  }
}
function engRun(req) { ENG.cur = req; ENG.w.postMessage("position fen " + req.fen); ENG.w.postMessage("go depth " + req.depth); }
function engGo(fen, depth) {
  engStart();
  return new Promise(function (res, rej) {
    if (ENG.dead) return rej(ENG.dead);
    var req = { res: res, rej: rej, type: "cp", val: 0, fen: fen, depth: depth };
    if (ENG.cur) { ENG.pending = req; ENG.w.postMessage("stop"); } else engRun(req);
  });
}
function engStop() { ENG.pending = null; if (ENG.w && ENG.cur) ENG.w.postMessage("stop"); }

/* évaluation : tout en centipions du point de vue des Blancs */
function whiteEval(r, turn) {
  var v;
  if (r.type === "mate") v = (r.val > 0 ? 1 : -1) * (10000 - Math.min(Math.abs(r.val), 99) * 20);
  else v = r.val;
  return turn === "w" ? v : -v;
}
function winPct(cp) { cp = Math.max(-1000, Math.min(1000, cp)); return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1); }
function fmtEval(cp) {
  if (Math.abs(cp) >= 10000) return cp > 0 ? "Mat (Blancs)" : "Mat (Noirs)";
  if (Math.abs(cp) >= 9000) { var n = Math.round((10000 - Math.abs(cp)) / 20); return (cp > 0 ? "+" : "−") + "M" + n; }
  var v = cp / 100; return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2).replace(".", ",");
}
var CLS = {
  book: { t: "Théorie", s: "≡", c: "c-book" }, best: { t: "Meilleur coup", s: "★", c: "c-best" }, exc: { t: "Excellent", s: "!", c: "c-exc" },
  good: { t: "Bon coup", s: "✓", c: "c-good" }, inac: { t: "Imprécision", s: "?!", c: "c-inac" }, err: { t: "Erreur", s: "?", c: "c-err" }, blu: { t: "Gaffe", s: "??", c: "c-blu" }
};

/* ---------- ouvertures : détection ---------- */
function openingMatch(sans) {
  var best = null, bk = 0;
  for (var i = 0; i < OPEN.length; i++) {
    var m = OPEN[i].m, k = 0;
    while (k < m.length && k < sans.length && m[k] === sans[k]) k++;
    if (k > bk) { bk = k; best = OPEN[i]; }
  }
  return bk >= 6 ? best : null;
}
function isBook(sans, i) {
  for (var j = 0; j < OPEN.length; j++) {
    var m = OPEN[j].m; if (i >= m.length) continue;
    var ok = true; for (var k = 0; k <= i; k++) if (m[k] !== sans[k]) { ok = false; break; }
    if (ok) return true;
  }
  return false;
}

var EXAMPLE = '[Event "Exemple"]\n[White "Blancs"]\n[Black "Noirs"]\n[Result "1-0"]\n\n1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5 5. exd5 Nxd5 6. Nxf7 Kxf7 7. Qf3+ Ke6 8. Nc3 Nb4 9. O-O c6 10. Re1 Bd6 11. d4 Kd7 12. Bg5 Qe8 13. Rad1 Nxc2 14. Bf4 Nxd4 15. Bxe5 Nxf3+ 16. gxf3 Bxe5 17. Rxe5 Qf7 18. Nxd5 cxd5 19. Bxd5 Re8 20. Rxe8 Kxe8 21. Re1+ Kd8 22. Bxf7 1-0';
function parseGame(text) {
  var C = window.Chess, g;
  function tryLoad(t) { g = new C(); g.loadPgn(t); return g; }
  text = text.replace(/\r/g, "").trim();
  if (!text) throw new Error("Colle d'abord un PGN.");

  catch (e) {
    var t2 = text.replace(/\{[^}]*\}/g, " ").replace(/\([^)]*\)/g, " ").replace(/\$\d+/g, " ");
    try { tryLoad(t2); } catch (e2) {
      var t3 = t2.replace(/\[[^\]]*\]/g, " ").replace(/\s+/g, " ").trim();
      try { tryLoad(t3); } catch (e3) { throw new Error("PGN illisible. Vérifie qu'il est complet (en-têtes puis les coups)."); }
    }
  }
  var hist = g.history({ verbose: true });
  if (!hist.length) throw new Error("Aucun coup trouvé dans ce PGN.");
  return { hdr: g.getHeaders(), hist: hist, start: hist[0].before };
}
function pageAnalyse() {
  var depthSaved = sget("ecl_depth", 14);
  main.innerHTML =
    "<h1>Analyse de partie</h1><p class=\"mut\">Colle un PGN, Stockfish 18 évalue chaque coup directement dans ton navigateur.</p>" +

    '<div class="row" style="margin-top:10px"><div><label for="dp">Précision de l\'analyse</label><select id="dp"><option value="10">Rapide (profondeur 10)</option><option value="14">Normal (profondeur 14)</option><option value="18">Profond (profondeur 18, plus long)</option></select></div>' +
    '<button class="btn pri bigbtn" id="go">Analyser</button><button class="btn" id="pa">Coller</button><button class="btn" id="ex">Exemple</button><button class="btn dng" id="stop" style="display:none">Arrêter</button></div>' +
    '<div class="prog" id="pg" style="display:none"><i id="pgi"></i></div><div id="pgt" class="small mut"></div><div id="err"></div></div>' +
    '<div id="out" style="margin-top:18px"></div>' +
    '<div class="about glass"><h2>À propos de l\'analyse</h2><p>Stockfish évalue chaque position de la partie. La barre d\'évaluation et la courbe montrent qui est mieux : au-dessus de zéro, les Blancs ; en dessous, les Noirs. La flèche indique le meilleur coup du moteur dans la position affichée.</p><p>Astuce : utilise les flèches ← → du clavier pour naviguer dans la partie.</p></div>';
  var A = null, running = false;
  $("pgn").value = sget("ecl_pgn", "");
  $("dp").value = String(depthSaved);
  $("ex").onclick = function () { $("pgn").value = EXAMPLE; };
  $("pa").onclick = function () { try { navigator.clipboard.readText().then(function (t) { $("pgn").value = t; showErr(""); }, function () { showErr("Ton navigateur bloque le collage automatique : fais Ctrl+V dans la zone de texte."); }); } catch (e) { showErr("Fais Ctrl+V dans la zone de texte."); } };
  $("stop").onclick = function () { if (A) A.abort = true; engStop(); };
  $("go").onclick = start;
  function showErr(m) { $("err").innerHTML = m ? '<div class="msg err">' + esc(m) + "</div>" : ""; }
  async function start() {
    if (running) return;
    showErr("");
    var G;
    try { G = parseGame($("pgn").value); } catch (e) { showErr(e.message); return; }
    sset("ecl_pgn", $("pgn").value);
    var depth = +$("dp").value; sset("ecl_depth", depth);
    var C = window.Chess, n = G.hist.length, fens = [G.start];
    G.hist.forEach(function (m) { fens.push(m.after); });
    A = { G: G, fens: fens, n: n, ev: [], best: [], ply: 0, flip: false, abort: false, done: false, depth: depth };
